<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full px-4 md:px-8 py-6 flex justify-between items-center border-b border-gray-100 bg-white">
        <a href="home.html" class="flex items-center gap-2">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 md:h-10 w-auto">
        </a>
        <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
            <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20"
                alt="English">
            <span class="font-medium text-sm">English</span>
            <i class="ph ph-caret-down text-xs"></i>
        </div>
    </header>

    <!-- Main Content -->
    <style>
        .exact-btn {
            background-color: #448ae6 !important;
            height: 40px;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        .exact-btn:hover {
            background-color: #3b76c4 !important;
        }

        .icon-circle {
            background-color: #448ae6;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
    </style>
    <!-- Main Content -->
    <!-- Main Content -->
    <style>
        .onboarding-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 48px 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .stepper-container {
            position: relative;
            width: 100%;
            margin-bottom: 64px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .step-line-bg {
            position: absolute;
            top: 14px;
            left: 10%;
            right: 10%;
            height: 1px;
            background-color: #e2e8f0;
            z-index: 0;
        }

        .step-line-active {
            position: absolute;
            top: 14px;
            left: 10%;
            width: 10%;
            height: 2px;
            background-color: #448ae6;
            z-index: 0;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 10;
            flex: 1;
        }

        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: white;
            border: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .step-circle.active {
            border: 2px solid #448ae6;
        }

        .step-inner-circle {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #448ae6;
        }

        .step-text {
            font-size: 13px;
            color: #334155;
            font-weight: 400;
            text-align: center;
        }

        .step-text.active {
            color: #0e1726;
            font-weight: 700;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-title {
            font-size: 26px;
            font-weight: 700;
            color: #0e1726;
            margin-bottom: 12px;
        }

        .form-subtitle {
            font-size: 14.5px;
            color: #64748b;
        }

        .onboarding-form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #0e1726;
            text-align: left;
            margin-bottom: 2px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #0e1726;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:focus {
            border-color: #448ae6;
            box-shadow: 0 0 0 1px #448ae6;
        }

        .form-textarea {
            resize: none;
        }

        .btn-next {
            background-color: #e2e8f0;
            color: #64748b;
            font-weight: 600;
            font-size: 14.5px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 12px;
        }

        .btn-next:hover {
            background-color: #cbd5e1;
        }
    </style>

    <main class="bg-white flex-grow">
        <div class="onboarding-container">

            <!-- Stepper -->
            <div class="stepper-container">
                <!-- Line background -->
                <div class="step-line-bg"></div>
                <!-- Line active -->
                <div class="step-line-active"></div>

                <!-- Step 1 (Active) -->
                <div class="step-item">
                    <div class="step-circle active">
                        <div class="step-inner-circle"></div>
                    </div>
                    <span class="step-text active">Organization Information</span>
                </div>

                <!-- Step 2 -->
                <div class="step-item">
                    <div class="step-circle"></div>
                    <span class="step-text">Organization Address</span>
                </div>

                <!-- Step 3 -->
                <div class="step-item">
                    <div class="step-circle"></div>
                    <span class="step-text">Production Capabilities</span>
                </div>

                <!-- Step 4 -->
                <div class="step-item">
                    <div class="step-circle"></div>
                    <span class="step-text">Certifications</span>
                </div>

                <!-- Step 5 -->
                <div class="step-item">
                    <div class="step-circle"></div>
                    <span class="step-text">Contact Person</span>
                </div>
            </div>

            <!-- Form Header -->
            <div class="form-header">
                <h1 class="form-title">Organization Information</h1>
                <p class="form-subtitle">Enter your organization's basic details to get started and set up your account.
                </p>
            </div>

            <!-- Form Content -->
            <form class="onboarding-form">

                <div class="form-group">
                    <label class="form-label">Manufacturer slug/username</label>
                    <input type="text" placeholder="Enter slug/username" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Website (optional)</label>
                    <input type="url" placeholder="Enter URL" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Description *</label>
                    <textarea rows="6" placeholder="Type here" class="form-input form-textarea"></textarea>
                </div>

                <button type="button" onclick="window.location.href='onboarding-2.html'" class="btn-next">Next</button>

            </form>

        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full pb-14 flex flex-col items-center gap-6 text-[14px] text-[#334155]">
        <div class="flex items-center gap-3">
            <a href="privacy-policy.html" class="hover:text-slate-900 transition-colors">Privacy Policy</a>
            <span class="text-slate-300 font-light">|</span>
            <a href="terms-of-service.html" class="hover:text-slate-900 transition-colors">Terms of Service</a>
        </div>
        <div class="flex items-center gap-2 text-[#64748b]">
            <span>© 2026 DonauAI</span>
        </div>
    </footer>

</body>

</html>
