<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full px-8 py-6 flex justify-between items-center">
        <a href="signin.html" class="flex items-center gap-2">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 w-auto">
        </a>
        
        <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
            <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20" alt="English">
            <span class="font-medium text-sm">English</span>
            <i class="ph ph-caret-down text-xs"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="grow flex items-center justify-center px-4">
        <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-[500px] text-center">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Forgot Password</h1>
            <p class="text-slate-500 text-sm mb-8">Please enter the email associated with your account. We'll send you a link to reset your password.</p>

            <form class="space-y-6 text-left">
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-900 mb-1.5">Email</label>
                    <input type="email" id="email" placeholder="Enter Email" 
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <button type="button" onclick="window.location.href = 'reset-password.html'"
            class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-sm"
          >
            Send Instructions
                </button>
            </form>

            <div class="mt-6 text-sm text-slate-600">
                Back to <a href="signin.html" class="text-blue-600 font-medium hover:underline">Sign In</a>
            </div>
        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full px-8 py-6 text-sm text-slate-500 flex items-center gap-4">
        <span>&copy; 2026 DonauAI</span>
        <span class="w-px h-3 bg-slate-300"></span>
        <a href="privacy-policy.html" class="hover:text-slate-900">Privacy Policy</a>
        <span class="w-px h-3 bg-slate-300"></span>
        <a href="terms-of-service.html" class="hover:text-slate-900">Terms of Service</a>
    </footer>

</body>
</html>
