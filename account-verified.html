<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verified - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full px-8 py-6 flex justify-between items-center">
        <a href="signin.html" class="flex items-center gap-2">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 w-auto">
        </a>
        
        <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
            <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20" alt="English">
            <span class="font-medium text-sm">English</span>
            <i class="ph ph-caret-down text-xs"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="grow flex items-center justify-center px-4">
        <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-[500px] text-center">
            
            <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center mx-auto mb-6 text-white text-3xl shadow-lg shadow-blue-200">
                <i class="ph ph-check"></i>
            </div>

            <h1 class="text-2xl font-bold text-slate-900 mb-2">Account Verified</h1>
            <p class="text-slate-500 text-sm mb-8">
                Your email has been verified and your account is now active.
            </p>

            <button type="button" onclick="window.location.href = 'dashboard-filled.html'"
            class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-sm"
          >
            Continue to Dashboard
            </button>
        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full px-8 py-6 text-sm text-slate-500 flex items-center gap-4">
        <span>&copy; 2026 DonauAI</span>
        <span class="w-px h-3 bg-slate-300"></span>
        <a href="privacy-policy.html" class="hover:text-slate-900">Privacy Policy</a>
        <span class="w-px h-3 bg-slate-300"></span>
        <a href="terms-of-service.html" class="hover:text-slate-900">Terms of Service</a>
    </footer>

</body>
</html>
