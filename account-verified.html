<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full px-4 md:px-8 py-6 flex justify-between items-center border-b border-gray-100 bg-white">
        <a href="home.html" class="flex items-center gap-2">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 md:h-10 w-auto">
        </a>
        <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
            <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20"
                alt="English">
            <span class="font-medium text-sm">English</span>
            <i class="ph ph-caret-down text-xs"></i>
        </div>
    </header>

    <!-- Main Content -->
    <style>
        .exact-btn {
            background-color: #448ae6 !important;
            height: 40px;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        .exact-btn:hover {
            background-color: #3b76c4 !important;
        }

        .icon-circle {
            background-color: #448ae6;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
    </style>
    <main class="bg-white"
        style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 1rem;">
        <div style="width: 100%; max-width: 440px; margin: 0 auto; text-align: center;">

            <div class="icon-circle">
                <i class="ph ph-check" style="color: white; font-size: 28px;"></i>
            </div>

            <div class="text-center" style="margin-bottom: 20px;">
                <h1 class="font-bold tracking-tight"
                    style="font-size: 26px; color: #0e1726; margin-bottom: 12px; text-align: center;">Account Verified
                </h1>
                <p
                    style="color: #64748b; font-size: 14.5px; margin: 0 auto; line-height: 1.6; max-width: 420px; text-align: center;">
                    Your email has been verified and your account is now active.
                </p>
            </div>

            <button type="button" onclick="window.location.href='onboarding-1.html'"
                class="w-full flex items-center justify-center text-white font-bold transition-all cursor-pointer exact-btn"
                style="font-size: 15px;">
                Sign In
            </button>
        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full pb-14 flex flex-col items-center gap-6 text-[14px] text-[#334155]">
        <div class="flex items-center gap-3">
            <a href="privacy-policy.html" class="hover:text-slate-900 transition-colors">Privacy Policy</a>
            <span class="text-slate-300 font-light">|</span>
            <a href="terms-of-service.html" class="hover:text-slate-900 transition-colors">Terms of Service</a>
        </div>
        <div class="flex items-center gap-2 text-[#64748b]">
            <span>© 2026 DonauAI</span>
        </div>
    </footer>

</body>

</html>
