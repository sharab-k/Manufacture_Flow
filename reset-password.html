<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full px-4 md:px-8 py-6 flex justify-between items-center border-b border-gray-100 bg-white">
        <a href="home.html" class="flex items-center gap-2">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 md:h-10 w-auto">
        </a>

        <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
            <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20"
                alt="English">
            <span class="font-medium text-sm">English</span>
            <i class="ph ph-caret-down text-xs"></i>
        </div>
    </header>

    <!-- Main Content -->
    <style>
        .exact-btn {
            background-color: #448ae6 !important;
            height: 44px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .exact-btn:hover {
            background-color: #3b76c4 !important;
        }

        .exact-input {
            border-radius: 10px;
            border-color: #d1d5db;
            color: #0e1726;
            font-size: 15px;
        }

        .exact-input::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        .exact-input:focus {
            border-color: #448ae6;
            box-shadow: none;
            outline: none;
        }
    </style>
    <main class="bg-white"
        style="flex-grow: 1; display: flex; align-items: flex-start; justify-content: center; padding: 4rem 1rem;">
        <div style="width: 100%; max-width: 440px; margin: 0 auto;">
            <div class="text-center" style="margin-bottom: 40px;">
                <h1 class="font-bold tracking-tight" style="font-size: 32px; color: #0e1726; margin-bottom: 12px;">
                    Create New Password</h1>
                <p style="color: #94a3b8; font-size: 16px; margin: 0; line-height: 1.5;">
                    Enter a strong new password to secure your account.
                </p>
            </div>

            <form onsubmit="event.preventDefault(); window.location.href='password-successful.html';" novalidate>
                <div style="display: flex; flex-direction: column; gap: 24px;">
                    <div>
                        <label for="new_password" class="block font-bold"
                            style="font-size: 15px; color: #0e1726; margin-bottom: 10px;">New Password</label>
                        <div class="relative">
                            <input type="password" id="new_password" value="12345678"
                                class="w-full px-4 py-3 border exact-input transition-all pr-12" />
                            <button type="button"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700 transition-colors">
                                <i class="ph ph-eye-slash" style="font-size: 22px; color: #0e1726;"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="confirm_password" class="block font-bold"
                            style="font-size: 15px; color: #0e1726; margin-bottom: 10px;">Confirm Password</label>
                        <div class="relative">
                            <input type="password" id="confirm_password" value="12345678"
                                class="w-full px-4 py-3 border exact-input transition-all pr-12" />
                            <button type="button"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700 transition-colors">
                                <i class="ph ph-eye-slash" style="font-size: 22px; color: #0e1726;"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full flex items-center justify-center text-white font-bold transition-all cursor-pointer exact-btn"
                        style="font-size: 16px; margin-top: 8px;">
                        Save Password
                    </button>
                </div>
            </form>
        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full pb-14 flex flex-col items-center gap-6 text-[14px] text-[#334155]">
        <div class="flex items-center gap-3">
            <a href="privacy-policy.html" class="hover:text-slate-900 transition-colors">Privacy Policy</a>
            <span class="text-slate-300 font-light">|</span>
            <a href="terms-of-service.html" class="hover:text-slate-900 transition-colors">Terms of Service</a>
        </div>
        <div class="flex items-center gap-2 text-[#64748b]">
            <span>© 2026 DonauAI</span>
        </div>
    </footer>

</body>

</html>
