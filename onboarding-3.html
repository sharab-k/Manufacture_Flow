<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-white min-h-screen flex flex-col justify-between">

        <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-4 md:px-8 shrink-0 h-[72px] sticky top-0 z-50">
        <div class="max-w-[1240px] mx-auto w-full h-full flex items-center justify-between">
            <a href="dashboard-filled.html" class="flex items-center gap-2">
                <img src="./Group 1597890314 (1).svg" alt="Logo" class="h-7 w-auto">
            </a>
            <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
                <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20" alt="English">
                <span class="font-medium text-sm">English</span>
                <i class="ph ph-caret-down text-xs"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <style>
        .onboarding-container {
            max-width: 860px;
            margin: 0 auto;
            padding: 48px 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .stepper-container {
            position: relative;
            width: 100%;
            margin-bottom: 64px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .step-line-bg {
            position: absolute;
            top: 14px;
            left: 10%;
            right: 10%;
            height: 1px;
            background-color: #e2e8f0;
            z-index: 0;
        }

        .step-line-active {
            position: absolute;
            top: 14px;
            left: 10%;
            width: 45%;
            height: 2px;
            background-color: #448ae6;
            z-index: 0;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 10;
            flex: 1;
        }

        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: white;
            border: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .step-circle.active {
            border: 2px solid #448ae6;
        }

        .step-circle.completed {
            background-color: #448ae6;
            border: none;
        }

        .step-inner-circle {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #448ae6;
        }

        .step-text {
            font-size: 13px;
            color: #334155;
            font-weight: 400;
            text-align: center;
        }

        .step-text.active,
        .step-text.completed {
            color: #0e1726;
            font-weight: 700;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-title {
            font-size: 26px;
            font-weight: 700;
            color: #0e1726;
            margin-bottom: 12px;
        }

        .form-subtitle {
            font-size: 14.5px;
            color: #64748b;
        }

        .onboarding-form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #0e1726;
            text-align: left;
            margin-bottom: 2px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #0e1726;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:focus {
            border-color: #448ae6;
            box-shadow: 0 0 0 1px #448ae6;
        }

        .btn-next {
            background-color: #e2e8f0;
            color: #64748b;
            font-weight: 600;
            font-size: 14.5px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 12px;
        }

        .btn-next:hover {
            background-color: #cbd5e1;
        }

        .btn-skip {
            background: none;
            border: none;
            color: #448ae6;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            padding: 8px;
            margin-top: -8px;
        }

        .btn-skip:hover {
            text-decoration: underline;
        }
    </style>

    <main class="bg-white flex-grow">
        <div class="onboarding-container">

            <!-- Stepper -->
            <div class="stepper-container">
                <!-- Line background -->
                <div class="step-line-bg"></div>
                <!-- Line active -->
                <div class="step-line-active"></div>

                <!-- Step 1 (Completed) -->
                <div class="step-item">
                    <div class="step-circle completed">
                        <i class="ph ph-check" style="color: white; font-size: 16px; font-weight: bold;"></i>
                    </div>
                    <span class="step-text completed">Organization Information</span>
                </div>

                <!-- Step 2 (Completed) -->
                <div class="step-item">
                    <div class="step-circle completed">
                        <i class="ph ph-check" style="color: white; font-size: 16px; font-weight: bold;"></i>
                    </div>
                    <span class="step-text completed">Organization Address</span>
                </div>

                <!-- Step 3 (Active) -->
                <div class="step-item">
                    <div class="step-circle active">
                        <div class="step-inner-circle"></div>
                    </div>
                    <span class="step-text active">Production Capabilities</span>
                </div>

                <!-- Step 4 -->
                <div class="step-item">
                    <div class="step-circle"></div>
                    <span class="step-text">Certifications</span>
                </div>

                <!-- Step 5 -->
                <div class="step-item">
                    <div class="step-circle"></div>
                    <span class="step-text">Contact Person</span>
                </div>
            </div>

            <!-- Form Header -->
            <div class="form-header">
                <h1 class="form-title">Production Capabilities</h1>
                <!-- Retaining the specific subtitle text from the design, even if visually inconsistent with other headers -->
                <p class="form-subtitle">Add the primary contact person's details so we can stay in touch with you.</p>
            </div>

            <!-- Form Content -->
            <form class="onboarding-form">

                <div class="form-group">
                    <label class="form-label">Product Category</label>
                    <input type="text" placeholder="e.g. Knitwear, Denim, Activewear" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Monthly Capacity</label>
                    <input type="text" placeholder="e.g. 50,000 units" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Minimum Order Qty</label>
                    <input type="text" placeholder="e.g. 500 units" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Lead Time</label>
                    <input type="text" placeholder="e.g. 4-8 weeks" class="form-input">
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button type="button" onclick="window.location.href='onboarding-4.html'"
                        class="btn-next">Next</button>
                    <button type="button" onclick="window.location.href='onboarding-4.html'"
                        class="btn-skip">Skip</button>
                </div>

            </form>

        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full pb-14 flex flex-col items-center gap-6 text-[14px] text-[#334155]">
        <div class="flex items-center gap-3">
            <a href="privacy-policy.html" class="hover:text-slate-900 transition-colors">Privacy Policy</a>
            <span class="text-slate-300 font-light">|</span>
            <a href="terms-of-service.html" class="hover:text-slate-900 transition-colors">Terms of Service</a>
        </div>
        <div class="flex items-center gap-2 text-[#64748b]">
            <span>© 2026 DonauAI</span>
        </div>
    </footer>

</body>

</html>
