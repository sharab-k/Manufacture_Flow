<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full px-4 md:px-8 py-6 flex justify-between items-center">
            <a href="home.html" class="flex flex-col items-center mb-8">
                 <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 md:h-10 w-auto mb-2">
            </a>      <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
            <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20" alt="English">
            <span class="font-medium text-sm">English</span>
            <i class="ph ph-caret-down text-xs"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="grow flex items-center justify-center px-4 py-8">
        <div class="bg-white p-6 md:p-10 rounded-2xl shadow-xl w-full max-w-[500px] text-center">
            
            <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center mx-auto mb-6 text-white text-3xl shadow-lg shadow-blue-200">
                <i class="ph ph-envelope-simple"></i>
            </div>

            <h1 class="text-2xl font-bold text-slate-900 mb-2">Verify Your Email</h1>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">
                We've sent a verification link to your email. Please verify to activate your account.
            </p>

            <button type="button" onclick="window.location.href='signin.html'" 
                class="w-full py-3 px-4 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg transition-colors cursor-pointer shadow-md shadow-blue-200">
                Sign In
            </button>
        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full px-4 md:px-8 py-6 text-sm text-slate-500 flex flex-col md:flex-row justify-center md:items-center gap-2 md:gap-4 text-center md:text-left">
        <span>&copy; 2026 DonauAI</span>
        <span class="hidden md:block w-px h-3 bg-slate-300"></span>
        <div class="flex items-center justify-center gap-4">
            <a href="privacy-policy.html" class="hover:text-slate-900">Privacy Policy</a>
            <span class="w-px h-3 bg-slate-300"></span>
            <a href="terms-of-service.html" class="hover:text-slate-900">Terms of Service</a>
        </div>
    </footer>

</body>
</html>
