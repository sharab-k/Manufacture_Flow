<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
        <!-- Logo -->
        <div class="h-18 flex items-center px-6">
             <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 w-auto">
        </div>

        <!-- Nav Links -->
        <div class="flex-1 px-4 py-6 space-y-1">
            <a href="dashboard-filled.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-squares-four text-lg"></i>
                Dashboard
            </a>
            <a href="briefs.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-magnifying-glass text-lg"></i>
                Find Briefs
            </a>
            <a href="messages.html" class="flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-chat-circle-dots text-lg"></i>
                Messages
            </a>
            <a href="settings-account.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-gear text-lg"></i>
                Settings
            </a>
        </div>

        <!-- Bottom Actions -->
        <div class="p-4 border-t border-gray-100">
            <a href="signin.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-sign-out text-lg"></i>
                Sign Out
            </a>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0">
        
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 h-18 flex items-center justify-between px-8 shrink-0">
            <!-- Search -->
            <div class="w-96">
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input type="text" placeholder="Search briefs, manufacturers..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-400">
                </div>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-4">
                <a href="help-center.html" class="text-slate-400 hover:text-slate-600">
                    <i class="ph ph-question text-xl"></i>
                </a>
                <button class="text-slate-400 hover:text-slate-600 relative">
                    <i class="ph ph-bell text-xl"></i>
                    <!-- Notification Dot if needed -->
                    <!-- <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span> -->
                </button>
                <a href="settings-account.html" class="text-slate-400 hover:text-slate-600">
                    <i class="ph ph-user-circle text-xl"></i>
                </a>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col min-h-0 p-6 overflow-hidden">
            
            <div class="mb-4 shrink-0">
                <h1 class="text-2xl font-bold text-slate-900">Messages</h1>
            </div>
    
            <div class="grow flex gap-6 min-h-0">
                <!-- Sidebar -->
                <div class="w-[380px] bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col overflow-hidden shrink-0">
                    <div class="p-4 border-b border-gray-100 shrink-0">
                        <h2 class="font-bold text-slate-900 mb-4">Messages</h2>
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="text" placeholder="Search..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                        </div>
                        <div class="flex gap-6 mt-4 border-b border-gray-100 pb-0">
                            <button class="text-sm font-medium text-blue-600 border-b-2 border-blue-600 pb-2 -mb-px">All (0)</button>
                            <button class="text-sm font-medium text-slate-500 pb-2 hover:text-slate-800">Unread (0)</button>
                        </div>
                    </div>
                    
                    <div class="grow overflow-y-auto p-4 flex flex-col items-center justify-center text-center">
                         <p class="text-sm text-slate-400">No conversations found</p>
                    </div>
                </div>
    
                <!-- Chat Area (Empty) -->
                <div class="grow bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col items-center justify-center text-center p-8">
                    <div class="w-16 h-16 rounded-full bg-gray-50 flex items-center justify-center text-slate-300 mb-4">
                        <i class="ph ph-chat-circle-slash text-3xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2">No Messages Yet</h3>
                    <p class="text-slate-500 text-sm max-w-sm mb-4">
                        No conversation has started yet. You can use this chat to ask the brand questions about their brief before submitting your proposal.
                    </p>
                    <a href="briefs.html" class="text-sm font-medium text-blue-600 hover:underline">Find Briefs to Apply</a>
                </div>
            </div>
    
        </main>
    </div>

    <script src="./src/js/main.js"></script>
</body>
</html>
