<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900/50 z-40 hidden md:hidden glass"></div>

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-col shrink-0 hidden md:flex transition-all duration-300">
        <!-- Logo -->
        <div class="h-18 flex items-center px-6 py-6">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 md:h-10 w-auto">
        </div>

        <!-- Nav Links -->
        <div class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <a href="dashboard-filled.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-squares-four text-lg"></i>
                Dashboard
            </a>
            <a href="briefs.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-magnifying-glass text-lg"></i>
                Find Briefs
            </a>
            <a href="messages.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-chat-circle-dots text-lg"></i>
                Messages
            </a>
            <a href="settings-account.html" class="flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-gear text-lg"></i>
                Settings
            </a>
        </div>

        <!-- Bottom Actions -->
        <div class="p-4 border-t border-gray-100">
            <a href="signin.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-sign-out text-lg"></i>
                Sign Out
            </a>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0">
        
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 h-18 flex items-center justify-between px-4 md:px-8 shrink-0">
            <div class="flex items-center gap-4">
                 <!-- Mobile Menu Toggle -->
                <button id="mobile-menu-toggle" class="md:hidden text-slate-500 hover:text-slate-700">
                    <i class="ph ph-list text-2xl"></i>
                </button>

                <!-- Search -->
                <div class="w-full md:w-96 hidden md:block">
                    <div class="relative">
                        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="text" placeholder="Search briefs, manufacturers..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-400">
                    </div>
                </div>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-4">
                <button class="md:hidden text-slate-400 hover:text-slate-600">
                    <i class="ph ph-magnifying-glass text-xl"></i>
                </button>
                <a href="help-center.html" class="text-slate-400 hover:text-slate-600">
                    <i class="ph ph-question text-xl"></i>
                </a>
                <button class="text-slate-400 hover:text-slate-600 relative">
                    <i class="ph ph-bell text-xl"></i>
                    <!-- Notification Dot if needed -->
                    <!-- <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span> -->
                </button>
                <a href="settings-account.html" class="text-slate-400 hover:text-slate-600">
                    <i class="ph ph-user-circle text-xl"></i>
                </a>
            </div>
        </header>

        <!-- Main Scrollable Area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-[1200px] mb-12">
                
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-slate-900">Settings</h1>
                </div>
        
                <div class="flex flex-col md:flex-row gap-6 md:gap-12 items-start">
                    <!-- Sidebar -->
                    <div class="w-full md:w-64 flex flex-col gap-2 shrink-0 overflow-x-auto">
                        <a href="settings-account.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-600 rounded-lg font-medium text-sm transition-colors">
                            <i class="ph ph-user-circle text-lg"></i>
                            Account
                        </a>
                        <a href="settings-manufacturer.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg font-medium text-sm transition-colors">
                            <i class="ph ph-buildings text-lg"></i>
                            Manufacturer Info
                        </a>
                        <a href="settings-security.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg font-medium text-sm transition-colors">
                            <i class="ph ph-lock-key text-lg"></i>
                            Security
                        </a>
                    </div>
        
                    <!-- Content -->
                    <div class="grow max-w-4xl space-y-6">
                        
                        <!-- Personal Information -->
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
                            <h2 class="text-lg font-bold text-slate-900 mb-6">Personal Information</h2>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="md:col-span-2">
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Email</label>
                                     <input type="email" value="michaelthompson@gmail.com" disabled class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-slate-500 cursor-not-allowed">
                                     <p class="text-[11px] text-slate-400 mt-1">Email cannot be changed</p>
                                </div>
        
                                <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">First Name</label>
                                     <input type="text" value="Michael" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                </div>
                                <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Last Name</label>
                                     <input type="text" value="Thompson" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                </div>
                                
                                 <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Job Title</label>
                                     <input type="text" value="Product Manufacturer" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                </div>
                                <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Date of Birth</label>
                                     <div class="relative">
                                        <input type="text" value="28/12/1985" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                        <i class="ph ph-calendar-blank absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                     </div>
                                </div>
        
                                <div class="md:col-span-2">
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Phone Number</label>
                                     <input type="text" value="+1 512 555 0189" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                </div>
        
                                <div class="md:col-span-2 flex justify-end">
                                    <button class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm">Save</button>
                                </div>
                            </div>
                        </div>
        
                        <!-- Language & Timezone -->
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
                             <h2 class="text-lg font-bold text-slate-900 mb-6">Language & Timezone</h2>
                             
                             <div class="space-y-6">
                                <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Time Zone</label>
                                     <div class="relative">
                                        <select class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500 appearance-none bg-white">
                                            <option>Eastern Time (US & Canada)</option>
                                            <option>Central Time (US & Canada)</option>
                                            <option>Pacific Time (US & Canada)</option>
                                        </select>
                                        <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                                     </div>
                                </div>
                                
                                 <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Language</label>
                                     <div class="relative">
                                        <select class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500 appearance-none bg-white">
                                            <option>English</option>
                                            <option>Spanish</option>
                                            <option>French</option>
                                        </select>
                                        <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                                     </div>
                                </div>
        
                                <div class="flex justify-end">
                                    <button class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm">Save</button>
                                </div>
                             </div>
                        </div>
        
                    </div>
                </div>
        
            </div>
        </main>
    </div>

    <script src="./src/js/main.js"></script>
</body>
</html>
