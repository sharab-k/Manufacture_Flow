<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
        <!-- Logo -->
        <div class="h-18 flex items-center px-6">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 w-auto">
        </div>

        <!-- Nav Links -->
        <div class="flex-1 px-4 py-6 space-y-1">
            <a href="dashboard-filled.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-squares-four text-lg"></i>
                Dashboard
            </a>
            <a href="briefs.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-magnifying-glass text-lg"></i>
                Find Briefs
            </a>
            <a href="messages.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-chat-circle-dots text-lg"></i>
                Messages
            </a>
            <a href="settings-account.html" class="flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-gear text-lg"></i>
                Settings
            </a>
        </div>

        <!-- Bottom Actions -->
        <div class="p-4 border-t border-gray-100">
            <a href="signin.html" class="flex items-center gap-3 px-3 py-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium transition-colors">
                <i class="ph ph-sign-out text-lg"></i>
                Sign Out
            </a>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0">
        
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 h-18 flex items-center justify-between px-8 flex-shrink-0">
            <!-- Search -->
            <div class="w-96">
                <div class="relative">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input type="text" placeholder="Search briefs, manufacturers..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-400">
                </div>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-4">
                <button class="text-slate-400 hover:text-slate-600 relative">
                    <i class="ph ph-bell text-xl"></i>
                    <!-- Notification Dot if needed -->
                    <!-- <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></span> -->
                </button>
                <button class="text-slate-400 hover:text-slate-600">
                    <i class="ph ph-user-circle text-xl"></i>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Area -->
        <main class="flex-1 overflow-y-auto p-8">
            <div class="max-w-[1200px] mb-12">
                
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-slate-900">Settings</h1>
                </div>
        
                <div class="flex gap-12 items-start">
                    <!-- Sidebar -->
                    <div class="w-64 flex flex-col gap-2 shrink-0">
                        <a href="settings-account.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg font-medium text-sm transition-colors">
                            <i class="ph ph-user-circle text-lg"></i>
                            Account
                        </a>
                        <a href="settings-manufacturer.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-gray-50 hover:text-slate-900 rounded-lg font-medium text-sm transition-colors">
                            <i class="ph ph-buildings text-lg"></i>
                            Manufacturer Info
                        </a>
                        <a href="settings-security.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-600 rounded-lg font-medium text-sm transition-colors">
                            <i class="ph ph-lock-key text-lg"></i>
                            Security
                        </a>
                    </div>
        
                    <!-- Content -->
                    <div class="grow max-w-4xl space-y-6">
                        
                        <!-- Password -->
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
                            <h2 class="text-lg font-bold text-slate-900 mb-6">Password</h2>
                            
                            <div class="space-y-6">
                                 <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Old Password</label>
                                     <div class="relative">
                                        <input type="password" placeholder="Enter password" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-slate-600">
                                            <i class="ph ph-eye-slash text-xl"></i>
                                        </button>
                                     </div>
                                </div>
        
                                 <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">New Password</label>
                                     <div class="relative">
                                        <input type="password" placeholder="Enter password" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-slate-600">
                                            <i class="ph ph-eye-slash text-xl"></i>
                                        </button>
                                     </div>
                                </div>
        
                                 <div>
                                     <label class="block text-sm font-semibold text-slate-900 mb-1.5">Confirm New Password</label>
                                     <div class="relative">
                                        <input type="password" placeholder="Re-enter password" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500">
                                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-slate-600">
                                            <i class="ph ph-eye-slash text-xl"></i>
                                        </button>
                                     </div>
                                </div>
        
                                <div class="flex justify-end">
                                    <button class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm">Save</button>
                                </div>
                            </div>
                        </div>
        
                    </div>
                </div>
        
            </div>
        </main>
    </div>

    <script src="./src/js/main.js"></script>
</body>
</html>
