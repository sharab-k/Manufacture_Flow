<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="w-full px-4 md:px-8 py-6 flex justify-between items-center border-b border-gray-100 bg-white">
        <a href="home.html" class="flex items-center gap-2">
            <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-8 md:h-10 w-auto">
        </a>
        <div class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900">
            <img src="https://flagcdn.com/w20/gb.png" srcset="https://flagcdn.com/w40/gb.png 2x" width="20"
                alt="English">
            <span class="font-medium text-sm">English</span>
            <i class="ph ph-caret-down text-xs"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="grow flex items-center justify-center px-4 py-8">
        <div class="bg-white p-6 md:p-10 rounded-2xl w-full max-w-[600px]">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900 mb-2">Create your account</h1>
                <p class="text-slate-500 text-sm">Start connecting with trusted partners today</p>
            </div>

            <form class="space-y-5">

                <!-- Account Type Selection -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-900 mb-2">I am a</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <label
                            class="border rounded-xl p-4 cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all flex items-start gap-3 group has-checked:border-blue-500 has-checked:bg-blue-50 has-checked:ring-1 has-checked:ring-blue-500">
                            <input type="radio" name="account_type" value="brand" class="hidden">
                            <div
                                class="p-2 bg-gray-100 rounded-lg group-has-checked:bg-blue-100 text-slate-500 group-has-checked:text-blue-600">
                                <i class="ph ph-buildings text-xl"></i>
                            </div>
                            <div>
                                <span class="block text-sm font-semibold text-slate-900">Brand</span>
                                <span class="block text-xs text-slate-500">Looking for manufacturers</span>
                            </div>
                        </label>
                        <label
                            class="border rounded-xl p-4 cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all flex items-start gap-3 group has-checked:border-blue-500 has-checked:bg-blue-50 has-checked:ring-1 has-checked:ring-blue-500">
                            <input type="radio" name="account_type" value="manufacturer" class="hidden" checked>
                            <div
                                class="p-2 bg-gray-100 rounded-lg group-has-checked:bg-blue-100 text-slate-500 group-has-checked:text-blue-600">
                                <i class="ph ph-factory text-xl"></i>
                            </div>
                            <div>
                                <span class="block text-sm font-semibold text-slate-900">Manufacturer</span>
                                <span class="block text-xs text-slate-500">Looking for clients</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="first_name" class="block text-sm font-semibold text-slate-900 mb-1.5">First
                            Name</label>
                        <input type="text" id="first_name" placeholder="Enter First Name"
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label for="last_name" class="block text-sm font-semibold text-slate-900 mb-1.5">Last
                            Name</label>
                        <input type="text" id="last_name" placeholder="Enter First Name"
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <div>
                    <label for="org_name" class="block text-sm font-semibold text-slate-900 mb-1.5">Organization
                        Name</label>
                    <input type="text" id="org_name" placeholder="Enter Organization Name"
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label for="work_email" class="block text-sm font-semibold text-slate-900 mb-1.5">Work Email</label>
                    <input type="email" id="work_email" placeholder="Enter Email"
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-900 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="Enter Password"
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all pr-10">
                        <button type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-slate-600">
                            <i class="ph ph-eye-slash text-xl"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-semibold text-slate-900 mb-1.5">Confirm
                        Password</label>
                    <div class="relative">
                        <input type="password" id="confirm_password" placeholder="Re-enter Password"
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all pr-10">
                        <button type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-slate-600">
                            <i class="ph ph-eye-slash text-xl"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-start gap-2">
                    <input type="checkbox" id="terms"
                        class="mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label for="terms" class="text-sm text-slate-600 leading-tight">
                        By creating an account, you agree to our <a href="terms-of-service.html"
                            class="text-blue-600 hover:underline">Terms of Service</a> and <a href="privacy-policy.html"
                            class="text-blue-600 hover:underline">Privacy Policy</a>
                    </label>
                </div>

                <button type="button" onclick="window.location.href = 'verify-email.html'"
                    class="w-full py-3.5 px-4 bg-[#3b82f6] hover:bg-[#2563eb] text-white font-semibold rounded-lg transition-all cursor-pointer text-[15px] shadow-sm hover:shadow-md">
                    Create Account
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-slate-600">
                Already have an account? <a href="signin.html" class="text-blue-600 font-medium hover:underline">Sign
                    In</a>
            </div>
        </div>
    </main>
    <script src="./src/js/main.js"></script>

    <!-- Footer -->
    <footer class="w-full pb-14 flex flex-col items-center gap-6 text-[14px] text-[#334155]">
        <div class="flex items-center gap-3">
            <a href="privacy-policy.html" class="hover:text-slate-900 transition-colors">Privacy Policy</a>
            <span class="text-slate-300 font-light">|</span>
            <a href="terms-of-service.html" class="hover:text-slate-900 transition-colors">Terms of Service</a>
        </div>
        <div class="flex items-center gap-2 text-[#64748b]">
            <span>© 2026 DonauAI</span>
        </div>
    </footer>

</body>

</html>
