<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Donau AI</title>
    <link href="./src/css/style.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .error-text {
          color: #dc2626 !important; /* text-red-600 */
      }
      .error-border {
          border-color: #dc2626 !important; /* border-red-600 */
          color: #dc2626 !important;
      }
      /* Ensure icon inherits color */
      .error-text i {
          color: inherit;
      }
    </style>
  </head>
  <body class="bg-gray-50 flex flex-col justify-between" style="min-height: 100vh;">
    <!-- Header -->
    <header class="w-full px-6 py-4 flex justify-between items-center bg-white border-b border-gray-100 shrink-0">
      <a href="home.html" class="flex items-center gap-2">
        <img src="./src/images/donau-logo.png" alt="Donau AI" class="h-7 w-auto">
      </a>

      <div
        class="flex items-center gap-2 text-slate-600 cursor-pointer hover:text-slate-900"
      >
        <img
          src="https://flagcdn.com/w20/gb.png"
          srcset="https://flagcdn.com/w40/gb.png 2x"
          width="20"
          alt="English"
        />
        <span class="font-medium text-sm">English</span>
        <i class="ph ph-caret-down text-xs"></i>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col justify-center items-center py-12 px-4 shrink-0">
      <div class="w-full max-w-[440px]">
        <div class="text-center mb-10">
          <h1 class="text-[28px] font-bold text-[#0F172A] mb-3">Welcome Back</h1>
          <p class="text-[#64748B] text-sm">
            Enter your credentials to access your account
          </p>
        </div>

        <form class="space-y-6" onsubmit="handleSignIn(event)" novalidate>
          <div>
            <label
              for="email"
              class="block text-[13px] font-bold text-[#0F172A] mb-2"
              >Email</label
            >
            <input
              type="email"
              id="email"
              placeholder="Enter Email"
              class="w-full px-4 h-11 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all bg-white"
            />
            <div id="email-error" class="hidden items-center gap-2 mt-2 error-text text-xs font-medium animate-fade-in">
              <i class="ph-fill ph-warning-circle text-base"></i>
              <span>Incorrect email. Please try again</span>
            </div>
          </div>

          <div>
            <label
              for="password"
              class="block text-[13px] font-bold text-[#0F172A] mb-2"
              >Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="password"
                placeholder="Enter Password"
                class="w-full px-4 h-11 border border-gray-200 rounded-lg text-sm text-slate-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all pr-10 bg-white"
              />
              <button
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-slate-700 font-bold"
              >
                <i class="ph ph-eye-slash text-lg"></i>
              </button>
            </div>
            <div id="password-error" class="hidden items-center gap-2 mt-2 error-text text-xs font-medium animate-fade-in">
              <i class="ph-fill ph-warning-circle text-base"></i>
              <span>Incorrect password. Please try again</span>
            </div>
          </div>

          <div class="flex items-center justify-between pb-1">
            <label class="flex items-center gap-2.5 cursor-pointer">
              <div class="relative flex items-center">
                <input
                  type="checkbox"
                  class="peer w-[18px] h-[18px] appearance-none border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 checked:bg-blue-600 checked:border-blue-600 transition-colors cursor-pointer bg-white"
                />
                <i class="ph ph-check text-white absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-xs opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity"></i>
              </div>
              <span class="text-[13px] text-[#64748B]">Remember Me</span>
            </label>
            <a
              href="forgot-password.html"
              class="text-[13px] font-bold text-[#3F8AE2] hover:text-[#3B82F6]"
              >Forgot Password</a
            >
          </div>

          <button
            type="submit"
            class="w-full h-11 bg-[#E2E8F0] hover:bg-[#CBD5E1] text-[#475569] text-sm font-medium rounded-lg transition-colors cursor-pointer"
          >
            Sign In
          </button>
        </form>

        <div class="mt-8 text-center text-[13px] text-[#0F172A] font-medium">
          Don't have an account?
          <a
            href="signup.html"
            class="text-[#3F8AE2] font-bold hover:underline ml-1"
            >Sign Up</a
          >
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="w-full px-6 py-8 text-[11px] text-[#475569] flex flex-col justify-center items-center gap-3 shrink-0"
    >
      <div class="flex items-center justify-center gap-2">
        <a href="privacy-policy.html" class="hover:text-slate-900">Privacy Policy</a>
        <span class="w-px h-3 bg-gray-300"></span>
        <a href="terms-of-service.html" class="hover:text-slate-900">Terms of Service</a>
      </div>
      <span>&copy; 2026 DonauAI</span>
    </footer>
    <script src="./src/js/main.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const form = document.querySelector('form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');

        // Listen for input changes to clear errors
        if (emailInput) {
            emailInput.addEventListener('input', () => {
                validateEmail();
            });
        }

        if (passwordInput) {
            passwordInput.addEventListener('input', () => {
                validatePassword();
            });
        }

        if (form) {
          form.addEventListener('submit', function(event) {
            event.preventDefault(); // Stop form from submitting immediately
            
            if (validateForm()) {
                console.log("Validation passed, navigating...");
                window.location.href = 'dashboard-filled.html';
            } else {
                console.log("Validation failed on submit");
            }
          });
        }

        function validateEmail() {
             const email = emailInput.value.trim();
             const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
             const isEmailValid = emailPattern.test(email);
             
             if (isEmailValid) {
                 emailError.classList.add('hidden');
                 emailError.classList.remove('flex');
                 emailInput.classList.remove('error-border', 'focus:ring-red-500');
                 emailInput.classList.add('border-gray-200', 'focus:ring-blue-500');
             }
             return isEmailValid;
        }

        function validatePassword() {
            const password = passwordInput.value.trim();
            const isPasswordValid = password.length >= 6;
            
            if (isPasswordValid) {
                 passwordError.classList.add('hidden');
                 passwordError.classList.remove('flex');
                 passwordInput.classList.remove('error-border', 'focus:ring-red-500');
                 passwordInput.classList.add('border-gray-200', 'focus:ring-blue-500');
            }
            return isPasswordValid;
        }

        function validateForm() {
            // This function is called on submit, so we show errors here.
            
            // Validate Email
            const email = emailInput.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const isEmailValid = emailPattern.test(email);
            
            if (!isEmailValid) {
                 emailError.classList.remove('hidden');
                 emailError.classList.add('flex');
                 emailInput.classList.add('error-border', 'focus:ring-red-500');
                 emailInput.classList.remove('border-gray-200', 'focus:ring-blue-500');
            } else {
                 emailError.classList.add('hidden');
                 emailError.classList.remove('flex');
                 emailInput.classList.remove('error-border', 'focus:ring-red-500');
                 emailInput.classList.add('border-gray-200', 'focus:ring-blue-500');
            }

            // Validate Password
            const password = passwordInput.value.trim();
            const isPasswordValid = password.length >= 6;
            
            if (!isPasswordValid) {
                 passwordError.classList.remove('hidden');
                 passwordError.classList.add('flex');
                 passwordInput.classList.add('error-border', 'focus:ring-red-500');
                 passwordInput.classList.remove('border-gray-200', 'focus:ring-blue-500');
            } else {
                 passwordError.classList.add('hidden');
                 passwordError.classList.remove('flex');
                 passwordInput.classList.remove('error-border', 'focus:ring-red-500');
                 passwordInput.classList.add('border-gray-200', 'focus:ring-blue-500');
            }

            return isEmailValid && isPasswordValid;
        }
      });
    </script>
  </body>
</html>
